name: Wake Streamlit app

on:
  schedule:
    # 00:17, 08:17, and 16:17 UTC (08:17, 16:17, and 00:17 in Taiwan).
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-streamlit-app
  cancel-in-progress: false

jobs:
  visit-and-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Open app and wake it if needed
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: node scripts/wake_streamlit.mjs
